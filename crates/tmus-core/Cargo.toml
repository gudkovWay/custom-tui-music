[package]
name = "tmus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Провайдер-независимое ядро tmus: типы, протокол, конфиг, cookies, офлайн-кэш"

[dependencies]
aes-gcm = "0.11.1"
base64.workspace = true
directories.workspace = true
hex.workspace = true
# Нужен `pbkdf2_hmac` под расшифровку cookies Chromium (PBKDF2-HMAC-SHA1,
# соль `saltysalt`, 1 итерация). Фича зовётся `hmac`; `simple` в 0.13 нет
# вовсе, и ошибка в её имени валит резолв до компиляции.
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
