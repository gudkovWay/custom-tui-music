  "Shift+Cyrillic_A", "Shift+Cyrillic_BE", "Shift+Cyrillic_VE", "Shift+Cyrillic_GHE",
  "Shift+Cyrillic_DE", "Shift+Cyrillic_IE", "Shift+Cyrillic_IO", "Shift+Cyrillic_ZHE",
