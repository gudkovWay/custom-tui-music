id = "q/tmus"
name = "Музыка"
version = "0.6.5"
# 32 = текущая версия хоста (kCurrentPluginApiVersion). Требуется не вообще
# «32», а конкретные возможности, взятые по минимуму:
#   22 — локальный require общего модуля ./desktop_skin.luau (kModuleRequire);
#   26 — noctalia.getSetting (kGetSetting) — чтение эффективного
#        family/plugins.enabled у q/skin-runtime из общего модуля;
#   31 — noctalia.getColor (kGetColor) — активные роли палитры под оверлеем.
# Остальные возможности панели/виджета много старше (capture_keys — 13,
# frame tick — 18, сервис-lifetime — 17), поэтому 32 — честный потолок
# хоста, а не выдуманное требование.
# При деплое рядом с модулем кладётся каталог skin-assets/ (blossom-рамка,
# углы, рельсы, эмблема — запасная презентация). При активной семье
# Stagecraft рамка, шапка и карточки рисуются родным материалом модуля, а
# blossom-картинки не показываются.
plugin_api = 32
author = "q"
license = "MIT"
dependencies = []
icon = "music"
description = "Пульт tmusd: буферная навигация, лента рекомендаций, очередь и спектр в панели."
tags = ["multimedia"]

[[widget]]
id = "tmus-widget"
entry = "widget.luau"
audio_spectrum = true
audio_spectrum_bands = 24

  [[widget.setting]]
  key = "title_width"
  type = "int"
  label_key = "settings.title_width.label"
  description_key = "settings.title_width.description"
  default = 28

[widget.actions]
middle = "none"

[[panel]]
id = "library"
entry = "panel.luau"
# Размер — ВХОД для бюджетов panel.luau: PANEL_W/PANEL_H там повторяют
# эти числа, из них выводятся окна списка/сетки/очереди (за вычетом
# рамки скина). Меняешь размер — правишь и константы панели.
width = 1180
height = 760
# Захват расширен до полного алфавита: пока панель открыта, она модальна
# по клавиатуре, а поисковый ввод ведётся самим плагином (см. TEXT_CHARS
# в panel.luau) — захваченный Enter до ui.input не доходит, и родной
# submit мёртв. Имена кейсимов сняты `xkbcli how-to-type --layout ru`,
# латиница приходит одним аккордом в верхнем регистре (сглаживает хост).
# Tab/ctrl+l/h = переключение буферов 2↔3 (центральный список ↔
# очередь); кириллические двойники — физические L/H = д/р на ЙЦУКЕН.
# ctrl+BackSpace = удалить слово в поиске. Home/End/Delete — курсор
# поисковой строки (границы/удаление справа). «?» (question) — модал
# подсказок; keysym один в обеих раскладках (ЙЦУКЕН — Shift+7).
# ctrl+v (физическая V на ЙЦУКЕН — м) вставляет clipboard в insert поиска.
# Имена по канону xkb: голые «</» хост отвергает весь плагин — только
# канонические кейсимы.
# Printable symbols need both bare and Shift chords: modifier matching is exact.
capture_keys = [
  "Left", "Right", "Up", "Down", "Return", "Escape", "Space", "slash",
  "period", "comma", "minus", "apostrophe", "BackSpace", "less", "greater",
  "question", "Shift+question", "Home", "End", "Delete",
  "exclam", "quotedbl", "numbersign", "dollar", "percent", "ampersand",
  "parenleft", "parenright", "asterisk", "plus", "colon", "semicolon",
  "equal", "at", "bracketleft", "backslash", "bracketright", "asciicircum",
  "underscore", "grave", "braceleft", "bar", "braceright", "asciitilde", "numerosign",
  "Shift+exclam", "Shift+quotedbl", "Shift+numbersign", "Shift+dollar",
  "Shift+percent", "Shift+ampersand", "Shift+apostrophe", "Shift+parenleft",
  "Shift+parenright", "Shift+asterisk", "Shift+plus", "Shift+comma", "Shift+minus",
  "Shift+period", "Shift+slash", "Shift+colon", "Shift+semicolon", "Shift+less",
  "Shift+equal", "Shift+greater", "Shift+at", "Shift+bracketleft", "Shift+backslash",
  "Shift+bracketright", "Shift+asciicircum", "Shift+underscore", "Shift+grave",
  "Shift+braceleft", "Shift+bar", "Shift+braceright", "Shift+asciitilde", "Shift+numerosign",
  "ctrl+j", "ctrl+k", "ctrl+Cyrillic_o", "ctrl+Cyrillic_el",
  "Tab", "ctrl+l", "ctrl+h", "ctrl+Cyrillic_de", "ctrl+Cyrillic_er",
  "ctrl+BackSpace",
  "ctrl+v", "ctrl+Cyrillic_em", "ctrl+Cyrillic_EM",
