[workspace]
resolver = "3"
members = [
    "crates/tmus-core",
    "crates/tmus-provider",
    "crates/tmus-ytmusic",
    "crates/tmus-player",
    "crates/tmus-daemon",
    "crates/tmus-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/gudkovWay/custom-tui-music"

[workspace.dependencies]
tmus-core = { path = "crates/tmus-core" }
tmus-provider = { path = "crates/tmus-provider" }
tmus-ytmusic = { path = "crates/tmus-ytmusic" }
tmus-player = { path = "crates/tmus-player" }

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
libc = "0.2.189"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    # В reqwest 0.13 фича зовётся `rustls`, а не `rustls-tls` (та осталась в
    # 0.12). Ошибка здесь валит резолв ВСЕГО воркспейса, а не одного крейта.
    "rustls",
    "gzip",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "fs",
    "process",
    "sync",
    "time",
    "signal",
] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.19.0", features = ["tokio"] }
discord-rich-presence = "1.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
